                <button
                  onClick={() => setLanguage("ru")}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1 ${language === 'ru' ? 'bg-blue-500 text-white shadow' : 'text-blue-300 hover:text-white'}`}
                >
                  <span>🇷🇺</span> РУС
                </button>
              </div>
            </div>

            {/* Mobile Bar */}
            <div className="md:hidden flex items-center justify-around border-t border-blue-900 bg-blue-950 px-2 py-1 text-xs font-semibold">
              <button onClick={() => setActiveTab("test")} className={`py-1.5 px-3 rounded-lg ${activeTab === 'test' ? 'bg-blue-600 text-white' : 'text-blue-300'}`}>{t.navTestSimulator}</button>
              <button onClick={() => setActiveTab("mistakes")} className={`py-1.5 px-3 rounded-lg relative ${activeTab === 'mistakes' ? 'bg-blue-600 text-white' : 'text-blue-300'}`}>
                {t.navMistakesReview} {activeMistakesCount > 0 && <span className="bg-rose-500 text-white text-[10px] px-1 rounded-full">{activeMistakesCount}</span>}
              </button>
              <button onClick={() => setActiveTab("profile")} className={`py-1.5 px-3 rounded-lg ${activeTab === 'profile' ? 'bg-blue-600 text-white' : 'text-blue-300'}`}>{t.navProfilePicker}</button>
            </div>
          </header>

          {/* TAB 1: PROFILE PICKER */}
          {activeTab === 'profile' && (
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex-1">
              <div className="text-center max-w-2xl mx-auto mb-8">
                <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900">{t.profileTitle}</h2>
                <p className="text-slate-500 text-sm mt-2">{t.profileDesc}</p>
              </div>

              {/* Mandatory */}
              <div className="mb-8">
                <h3 className="text-lg font-bold text-slate-900 mb-3 flex items-center gap-2">
                  <span className="w-2.5 h-2.5 rounded-full bg-blue-600"></span>
                  {t.mandatoryTitle}
                </h3>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {SUBJECTS_CONFIG.mandatory.map(s => (
                    <div key={s.id} className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm">
                      <span className="px-2 py-0.5 rounded text-[11px] font-bold bg-blue-50 text-blue-700">{s.code}</span>
                      <h4 className="font-bold text-slate-900 mt-2">{s.name[language]}</h4>
                      <div className="text-xs text-slate-500 mt-1">{s.questionCount} {t.question.toLowerCase()}</div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Profile Combos */}
              <div className="mb-8">
                <h3 className="text-lg font-bold text-slate-900 mb-3 flex items-center gap-2">
                  <span className="w-2.5 h-2.5 rounded-full bg-indigo-600"></span>
                  {t.profileTitle}
                </h3>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {SUBJECTS_CONFIG.profileCombinations.map(c => {
                    const isSel = selectedProfile === c.id;
                    return (
                      <div
                        key={c.id}
                        onClick={() => setSelectedProfile(c.id)}
                        className={`p-5 rounded-2xl border-2 cursor-pointer transition ${isSel ? 'border-blue-600 bg-blue-50 shadow-md ring-2 ring-blue-600/20' : 'border-slate-200 bg-white hover:border-blue-300'}`}
                      >
                        <div className="flex justify-between items-center mb-2">
                          <span className="text-xs font-bold px-2 py-0.5 rounded bg-indigo-100 text-indigo-800">Профиль</span>
                          {isSel && <span className="text-xs font-bold text-blue-600">✓ Выбрано</span>}
                        </div>
                        <h4 className="font-bold text-slate-900 text-base mb-1">{c.name[language]}</h4>
                        <p className="text-xs text-slate-600 mb-3">{c.description[language]}</p>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className="text-center">
                <button
                  onClick={() => setActiveTab("test")}
                  className="px-8 py-3.5 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-base shadow-xl transition active:scale-95"
                >
                  {t.startTestBtn}
                </button>
              </div>
            </div>
          )}

          {/* TAB 2: TEST SIMULATOR */}
          {activeTab === 'test' && (
            <TestSimulatorView
              language={language}
              selectedProfile={selectedProfile}
              onFinishTest={handleFinishTestWithMistakes}
            />
          )}

          {/* TAB 3: MISTAKES REVIEW PAGE */}
          {activeTab === 'mistakes' && (
            <MistakesReviewView
              language={language}
              mistakes={mistakes}
              onUpdateStatus={handleUpdateStatus}
              onLaunchRetest={items => setRetestItems(items)}
            />
          )}

          {/* RETEST MODAL */}
          {retestItems && (
            <RetestModalView
              language={language}
              items={retestItems}
              onClose={() => setRetestItems(null)}
              onResolve={handleResolveMistake}
            />
          )}
        </div>
      );
    }

    // ==========================================
    // 5. TEST SIMULATOR SUB-COMPONENT
    // ==========================================
    function TestSimulatorView({ language, selectedProfile, onFinishTest }) {
      const t = TRANSLATIONS[language];
      const activeSubjects = useMemo(() => {
        const list = [...SUBJECTS_CONFIG.mandatory];
        const combo = SUBJECTS_CONFIG.profileCombinations.find(c => c.id === selectedProfile);
        if (combo && combo.subjects) list.push(...combo.subjects);
        return list;
      }, [selectedProfile]);

      const [activeSubjectId, setActiveSubjectId] = useState(activeSubjects[0].id);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [answers, setAnswers] = useState({});
      const [timeLeft, setTimeLeft] = useState(120 * 60);

      const currentQuestions = useMemo(() => {
        const found = BILINGUAL_QUESTIONS.filter(q => q.subjectId === activeSubjectId && q.language === language);
        return found.length > 0 ? found : BILINGUAL_QUESTIONS.filter(q => q.subjectId === activeSubjectId);
      }, [activeSubjectId, language]);

      useEffect(() => { setCurrentIndex(0); }, [activeSubjectId]);

      useEffect(() => {
        const timer = setInterval(() => setTimeLeft(p => p > 1 ? p - 1 : 0), 1000);
        return () => clearInterval(timer);
      }, []);

      const q = currentQuestions[currentIndex] || currentQuestions[0];

      const handleFinish = () => {
        const ms = [];
        BILINGUAL_QUESTIONS.forEach(item => {
          const ans = answers[item.id];
          if (ans !== undefined && ans !== item.correctIndex) {
            ms.push({
              mistakeId: `m_${Date.now()}_${item.id}`,
              questionId: item.id,
              subjectId: item.subjectId,
              topicId: item.topicId,
              studentAnswerIndex: ans,
              status: "needs_review",
              attemptsCount: 1
            });
          }
        });
        onFinishTest(ms);
      };

      if (!q) return <div className="p-8 text-center">Загрузка вопросов...</div>;

      const letters = ["A", "B", "C", "D"];

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full">
          {/* Subject Pills */}
          <div className="flex items-center gap-2 overflow-x-auto pb-3 mb-6">
            {activeSubjects.map((sub, sIdx) => {
              const isActive = activeSubjectId === sub.id;
              return (
                <button
                  key={sub.id}
                  onClick={() => setActiveSubjectId(sub.id)}
                  className={`px-4 py-2.5 rounded-2xl text-xs sm:text-sm font-bold whitespace-nowrap transition border ${
                    isActive ? 'bg-blue-600 text-white border-blue-600 shadow' : 'bg-white text-slate-700 border-slate-200'
                  }`}
                >
                  {sIdx + 1}. {sub.shortName ? sub.shortName[language] : sub.name[language]}
                </button>
              );
            })}
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            {/* Question Card */}
            <div className="lg:col-span-8 bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
              <div className="px-6 py-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                <span className="bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded-xl">
                  {t.question} {currentIndex + 1} {t.of} {currentQuestions.length}
                </span>
                <span className="text-xs text-slate-500 font-semibold">{getSubjectById(activeSubjectId)?.name[language]}</span>
              </div>

              <div className="p-6 sm:p-8">
                <h3 className="text-base sm:text-lg font-semibold text-slate-900 mb-6 leading-relaxed select-text">
                  {q.question}
                </h3>

                <div className="space-y-3">
                  {q.options.map((opt, oIdx) => {
                    const isSel = answers[q.id] === oIdx;
                    return (
                      <div
                        key={oIdx}
                        onClick={() => setAnswers(p => ({ ...p, [q.id]: oIdx }))}
                        className={`flex items-start gap-4 p-4 rounded-2xl border-2 cursor-pointer transition ${
                          isSel ? 'border-blue-600 bg-blue-50/90 text-blue-950 font-semibold' : 'border-slate-200 bg-white hover:border-blue-300'
                        }`}
                      >
                        <span className={`w-7 h-7 rounded-full border-2 flex items-center justify-center text-xs font-bold ${
                          isSel ? 'bg-blue-600 border-blue-600 text-white' : 'border-slate-300 text-slate-600 bg-slate-50'
                        }`}>
                          {letters[oIdx]}
                        </span>
                        <span className="pt-0.5 text-sm sm:text-base flex-1">{opt}</span>
                        {isSel && <span className="text-blue-600 font-bold">✓</span>}
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className="px-6 py-4 bg-slate-50 border-t border-slate-200 flex justify-between items-center">
                <button
                  disabled={currentIndex === 0}
                  onClick={() => setCurrentIndex(p => p - 1)}
                  className="px-4 py-2 border rounded-xl text-xs sm:text-sm font-semibold disabled:opacity-40"
                >
                  {t.prev}
                </button>
                <button
                  onClick={() => {
                    if (currentIndex < currentQuestions.length - 1) setCurrentIndex(p => p + 1);
                    else handleFinish();
                  }}
                  className="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs sm:text-sm rounded-xl shadow"
                >
                  {currentIndex < currentQuestions.length - 1 ? t.next : t.finishTest}
                </button>
              </div>
            </div>

            {/* Matrix & Timer */}
            <div className="lg:col-span-4 bg-white rounded-3xl border border-slate-200 p-5 shadow-sm space-y-4">
              <div className="flex justify-between items-center pb-3 border-b border-slate-200">
                <span className="font-bold text-sm text-slate-800">Сетка вопросов</span>
                <span className="font-mono font-bold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-xl border border-emerald-200 text-sm">
                  ⏱️ {Math.floor(timeLeft / 60)}:{String(timeLeft % 60).padStart(2, '0')}
                </span>
              </div>

              <div className="grid grid-cols-5 gap-2">
                {currentQuestions.map((item, idx) => {
                  const isAns = answers[item.id] !== undefined;
                  const isCur = currentIndex === idx;
                  let st = "bg-slate-100 text-slate-700";
                  if (isAns) st = "bg-emerald-600 text-white";
                  if (isCur) st += " ring-2 ring-blue-600 font-black border-blue-600";

                  return (
                    <button
                      key={item.id}
                      onClick={() => setCurrentIndex(idx)}
                      className={`h-10 rounded-xl text-xs font-bold border ${st}`}
                    >
                      {idx + 1}
                    </button>
                  );
                })}
              </div>

              <button
                onClick={handleFinish}
                className="w-full py-3 bg-rose-600 hover:bg-rose-700 text-white rounded-xl font-bold text-xs sm:text-sm shadow transition"
              >
                {t.finishTest}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 6. MISTAKES REVIEW SUB-COMPONENT
    // ==========================================
    function MistakesReviewView({ language, mistakes, onUpdateStatus, onLaunchRetest }) {
      const t = TRANSLATIONS[language];
      const [selSub, setSelSub] = useState("all");
      const [selStatus, setSelStatus] = useState("all");

      const enriched = useMemo(() => {
        return mistakes.map(m => {
          let q = BILINGUAL_QUESTIONS.find(item => item.id === m.questionId);
          if (q && q.language !== language) {
            const eq = BILINGUAL_QUESTIONS.find(item => item.subjectId === q.subjectId && item.topicId === q.topicId && item.language === language);
            if (eq) q = eq;
          }
          return { ...m, questionData: q, subjectData: getSubjectById(m.subjectId) };
        }).filter(item => item.questionData);
      }, [mistakes, language]);

      const filtered = useMemo(() => {
        return enriched.filter(item => {
          if (selSub !== "all" && item.subjectId !== selSub) return false;
          if (selStatus !== "all" && item.status !== selStatus) return false;
          return true;
        });
      }, [enriched, selSub, selStatus]);

      const stats = {
        total: enriched.length,
        needsReview: enriched.filter(m => m.status === 'needs_review').length,
        resolved: enriched.filter(m => m.status === 'resolved').length
      };

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-6 font-sans">
          {/* Banner */}
          <div className="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 rounded-3xl p-6 sm:p-8 text-white shadow-xl mb-8 border border-slate-800">
            <h2 className="text-2xl sm:text-3xl font-black mb-2">{t.mistakesTitle}</h2>
            <p className="text-slate-300 text-sm">{t.mistakesSubtitle}</p>

            <div className="grid grid-cols-3 gap-4 mt-6 pt-6 border-t border-slate-800 text-center">
              <div className="bg-white/5 rounded-2xl p-3 border border-white/10">
                <div className="text-2xl font-bold">{stats.total}</div>
                <div className="text-[11px] text-slate-400 uppercase">{t.totalMistakes}</div>
              </div>
              <div className="bg-rose-500/10 rounded-2xl p-3 border border-rose-500/20">
                <div className="text-2xl font-bold text-rose-400">{stats.needsReview}</div>
                <div className="text-[11px] text-rose-300 uppercase">{t.activeMistakes}</div>
              </div>
              <div className="bg-emerald-500/10 rounded-2xl p-3 border border-emerald-500/20">
                <div className="text-2xl font-bold text-emerald-400">{stats.resolved}</div>
                <div className="text-[11px] text-emerald-300 uppercase">{t.resolvedMistakes}</div>
              </div>
            </div>

            {stats.needsReview > 0 && (
              <div className="mt-6 flex justify-between items-center bg-blue-600/30 p-4 rounded-2xl border border-blue-500/30">
                <span className="text-xs sm:text-sm text-blue-100">Изучите ошибки и закрепите их повторным тестом</span>
                <button
                  onClick={() => onLaunchRetest(filtered.filter(m => m.status === 'needs_review'))}
                  className="bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs sm:text-sm px-5 py-2.5 rounded-xl shadow transition active:scale-95"
                >
                  {t.retestActionBtn} ({stats.needsReview})
                </button>
              </div>
            )}
          </div>

          {/* Filters */}
          <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm mb-6 flex flex-wrap gap-4">
            <div className="flex-1 min-w-[200px]">
              <label className="block text-xs font-bold text-slate-600 uppercase mb-1">{t.filterSubject}</label>
              <select
                value={selSub}
                onChange={e => setSelSub(e.target.value)}
                className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm"
              >
                <option value="all">{t.allSubjects}</option>
                {SUBJECTS_CONFIG.mandatory.map(s => <option key={s.id} value={s.id}>{s.name[language]}</option>)}
                {SUBJECTS_CONFIG.profileCombinations.map(c => c.subjects.map(s => <option key={s.id} value={s.id}>{s.name[language]}</option>))}
              </select>
            </div>

            <div className="flex-1 min-w-[200px]">
              <label className="block text-xs font-bold text-slate-600 uppercase mb-1">{t.filterStatus}</label>
              <select
                value={selStatus}
                onChange={e => setSelStatus(e.target.value)}
                className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm"
              >
                <option value="all">{t.allStatuses}</option>
                <option value="needs_review">🔴 {t.statusNeedsReview}</option>
                <option value="resolved">🟢 {t.statusResolved}</option>
              </select>
            </div>
          </div>

          {/* Cards List */}
          {filtered.length === 0 ? (
            <div className="bg-white rounded-3xl p-10 text-center border border-slate-200">
              <h3 className="font-bold text-slate-800 text-base mb-1">{t.emptyMistakes}</h3>
              <p className="text-xs text-slate-500">{t.emptyMistakesDesc}</p>
            </div>
          ) : (
            <div className="space-y-6">
              {filtered.map(item => {
                const q = item.questionData;
                const isRes = item.status === 'resolved';
                const studentAns = q.options[item.studentAnswerIndex] || "—";
                const correctAns = q.options[q.correctIndex];

                return (
                  <div key={item.mistakeId} className={`rounded-2xl border p-6 bg-white shadow-sm ${isRes ? 'border-emerald-200' : 'border-rose-200'}`}>
                    <div className="flex justify-between items-center mb-3">
                      <span className="text-xs font-bold px-2.5 py-1 bg-blue-50 text-blue-800 rounded-lg">
                        {item.subjectData?.name[language]}
                      </span>
                      <div className="flex items-center gap-2">
                        <span className={`text-xs font-bold px-2.5 py-1 rounded-full ${isRes ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                          {isRes ? '✓ ' + t.statusResolved : '● ' + t.statusNeedsReview}
                        </span>
                        <button
                          onClick={() => onUpdateStatus(item.mistakeId, isRes ? 'needs_review' : 'resolved')}
                          className="text-xs text-slate-400 hover:text-slate-700 underline"
                        >
                          Сменить
                        </button>
                      </div>
                    </div>

                    <h4 className="font-semibold text-slate-900 text-base mb-4 leading-relaxed">{q.question}</h4>

                    {/* Red / Green Comparison */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
                      <div className="p-3 rounded-xl border-2 border-rose-300 bg-rose-50 text-rose-950">
                        <div className="text-xs font-bold uppercase text-rose-700 mb-1">✕ {t.yourAnswer}</div>
                        <div className="text-sm font-medium">{studentAns}</div>
                      </div>
                      <div className="p-3 rounded-xl border-2 border-emerald-300 bg-emerald-50 text-emerald-950">
                        <div className="text-xs font-bold uppercase text-emerald-700 mb-1">✓ {t.correctAnswer}</div>
                        <div className="text-sm font-medium">{correctAns}</div>
                      </div>
                    </div>

                    {/* Explanation */}
                    {q.explanation && (
                      <div className="bg-blue-50 border border-blue-200 rounded-xl p-3.5 text-xs text-blue-950 leading-relaxed">
                        <div className="font-bold text-blue-900 mb-1">📖 {t.methodExplanation}:</div>
                        <div>{q.explanation}</div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 7. RETEST MODAL SUB-COMPONENT
    // ==========================================
    function RetestModalView({ language, items, onClose, onResolve }) {
      const t = TRANSLATIONS[language];
      const [curIdx, setCurIdx] = useState(0);
      const [selOpt, setSelOpt] = useState(null);
      const [checked, setChecked] = useState(false);
      const [isCorrect, setIsCorrect] = useState(false);

      const item = items[curIdx];
      const q = item?.questionData;

      if (!q) return null;

      const handleCheck = () => {
        if (selOpt === null) return;
        const c = selOpt === q.correctIndex;
        setIsCorrect(c);
        setChecked(true);
        if (c) onResolve(item.mistakeId);
      };

      const handleNext = () => {
        setChecked(false);
        setSelOpt(null);
        if (curIdx < items.length - 1) setCurIdx(p => p + 1);
        else onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm">
          <div className="bg-white rounded-3xl p-6 sm:p-8 max-w-2xl w-full shadow-2xl border border-slate-200">
            <div className="flex justify-between items-center pb-3 border-b mb-4">
              <h3 className="font-bold text-slate-900 text-base">{t.retestModalTitle} ({curIdx + 1}/{items.length})</h3>
              <button onClick={onClose} className="text-slate-400 font-bold">✕</button>
            </div>

            <div className="text-base font-semibold text-slate-900 mb-5">{q.question}</div>

            <div className="space-y-2.5 mb-5">
              {q.options.map((opt, idx) => {
                let st = "border-slate-200 bg-white";
                if (checked) {
                  if (idx === q.correctIndex) st = "border-emerald-500 bg-emerald-50 text-emerald-950 font-bold";
                  else if (idx === selOpt && !isCorrect) st = "border-rose-400 bg-rose-50 text-rose-950 font-bold";
                } else if (selOpt === idx) {
                  st = "border-blue-600 bg-blue-50 text-blue-900 font-bold";
                }

                return (
                  <div
                    key={idx}
                    onClick={() => !checked && setSelOpt(idx)}
                    className={`p-3 rounded-xl border-2 cursor-pointer text-sm ${st}`}
                  >
                    {opt}
                  </div>
                );
              })}
            </div>

            {checked && (
              <div className={`p-3.5 rounded-xl border text-xs mb-4 ${isCorrect ? 'bg-emerald-50 border-emerald-300 text-emerald-900' : 'bg-rose-50 border-rose-300 text-rose-900'}`}>
                <div className="font-bold mb-1">{isCorrect ? '✓ ' + t.retestSuccessNotice : '✕ ' + t.retestFailNotice}</div>
                <div>{q.explanation}</div>
              </div>
            )}

            <div className="flex justify-between items-center pt-3 border-t">
              <button onClick={onClose} className="px-4 py-2 border rounded-xl text-xs font-semibold">{t.finishRetestBtn}</button>
              {!checked ? (
                <button
                  disabled={selOpt === null}
                  onClick={handleCheck}
                  className="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl disabled:opacity-40"
                >
                  Проверить
                </button>
              ) : (
                <button
                  onClick={handleNext}
                  className="px-6 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl"
                >
                  {curIdx < items.length - 1 ? t.next : t.finishRetestBtn}
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
