  <!-- STANDALONE STATE UNT SIMULATOR SCRIPT -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ==========================================
    // 1. CONFIG & METADATA
    // ==========================================
    const DIRECTIONS_CONFIG = [
      { id: 'fizmat', name: { ru: 'ФизМат (Математика + Физика)', kk: 'ФизМат (Математика + Физика)' }, p1: 'math', p2: 'physics' },
      { id: 'biohim', name: { ru: 'БиоХим (Биология + Химия)', kk: 'БиоХим (Биология + Химия)' }, p1: 'biology', p2: 'chemistry' },
      { id: 'geomat', name: { ru: 'ГеоМат (География + Математика)', kk: 'ГеоМат (География + Математика)' }, p1: 'geography', p2: 'math' }
    ];

    const SUBJECTS_METADATA = {
      history_kz: { id: 'history_kz', name: { ru: 'История Казахстана', kk: 'Қазақстан тарихы' }, count: 20, maxPoints: 20 },
      reading: { id: 'reading', name: { ru: 'Грамотность чтения', kk: 'Оқу сауаттылығы' }, count: 10, maxPoints: 10 },
      math_lit: { id: 'math_lit', name: { ru: 'Математическая грамотность', kk: 'Математикалық сауаттылық' }, count: 10, maxPoints: 10 },
      math: { id: 'math', name: { ru: 'Математика (профиль)', kk: 'Математика (бейіндік)' }, count: 40, maxPoints: 45 },
      physics: { id: 'physics', name: { ru: 'Физика (профиль)', kk: 'Физика (бейіндік)' }, count: 40, maxPoints: 45 },
      biology: { id: 'biology', name: { ru: 'Биология (профиль)', kk: 'Биология (бейіндік)' }, count: 40, maxPoints: 45 },
      chemistry: { id: 'chemistry', name: { ru: 'Химия (профиль)', kk: 'Химия (бейіндік)' }, count: 40, maxPoints: 45 },
      geography: { id: 'geography', name: { ru: 'География (профиль)', kk: 'География (бейіндік)' }, count: 40, maxPoints: 45 }
    };

    // ==========================================
    // 2. REAL SAMPLE QUESTIONS BANK
    // ==========================================
    const REAL_ENT_SAMPLES = [
      {
        id: 'hist_01',
        subjectId: 'history_kz',
        type: 'single',
        points: 1,
        question: {
          ru: 'Основателями Казахского ханства в 1465–1466 гг. являются султаны:',
          kk: '1465–1466 жж. Қазақ хандығының негізін қалаған сұлтандар:'
        },
        options: {
          ru: ['Керей и Жанибек', 'Касым и Хакназар', 'Абылай и Абулхаир', 'Есим и Тауке'],
          kk: ['Керей мен Жәнібек', 'Қасым мен Хақназар', 'Абылай мен Әбілқайыр', 'Есім мен Тәуке']
        },
        correctIndexes: [0],
        explanation: {
          ru: 'Согласно труду Мухаммеда Хайдара Дулати «Тарих-и Рашиди», султаны Керей и Жанибек основали Казахское ханство в долине реки Чу (Козыбасы).',
          kk: 'Мұхаммед Хайдар Дулатидің «Тарих-и Рашиди» еңбегі бойынша, Керей мен Жәнібек сұлтандар Қазақ хандығының туын тікті.'
        }
      },
      {
        id: 'mathlit_01',
        subjectId: 'math_lit',
        type: 'single',
        points: 1,
        question: {
          ru: 'Цена товара сначала снизилась на 20%, а затем новая цена увеличилась на 20%. Как изменилась первоначальная цена товара?',
          kk: 'Тауардың бағасы алдымен 20%-ға арзандап, кейін жаңа бағасы 20%-ға қымбаттады. Тауардың бастапқы бағасы қалай өзгерді?'
        },
        options: {
          ru: ['Уменьшилась на 4%', 'Не изменилась', 'Увеличилась на 4%', 'Уменьшилась на 2%'],
          kk: ['4%-ға кеміді', 'Өзгерген жоқ', '4%-ға артты', '2%-ға кеміді']
        },
        correctIndexes: [0],
        explanation: {
          ru: '100 * 0.8 = 80; 80 * 1.2 = 96. Итого: 100 - 96 = снижение на 4%.',
          kk: '100 * 0.8 = 80; 80 * 1.2 = 96. Нәтижесінде: 4%-ға азайды.'
        }
      },
      {
        id: 'math_prof_01',
        subjectId: 'math',
        type: 'single',
        points: 1,
        question: {
          ru: 'Найдите значение производной функции f(x) = x³ - 3x² + 5 в точке x₀ = 2:',
          kk: 'f(x) = x³ - 3x² + 5 функциясының x₀ = 2 нүктесіндегі туындысының мәнін табыңыз:'
        },
        options: {
          ru: ['0', '3', '-1', '12'],
          kk: ['0', '3', '-1', '12']
        },
        correctIndexes: [0],
        explanation: {
          ru: 'f\'(x) = 3x² - 6x. f\'(2) = 12 - 12 = 0.',
          kk: 'f\'(x) = 3x² - 6x. f\'(2) = 12 - 12 = 0.'
        }
      },
      {
        id: 'phys_01',
        subjectId: 'physics',
        type: 'single',
        points: 1,
        question: {
          ru: 'Тело массой 2 кг движется со скоростью 4 м/с. Чему равна его кинетическая энергия?',
          kk: 'Массасы 2 кг дене 4 м/с жылдамдықпен қозғалады. Оның кинетикалық энергиясы неге тең?'
        },
        options: {
          ru: ['16 Дж', '8 Дж', '32 Дж', '4 Дж'],
          kk: ['16 Дж', '8 Дж', '32 Дж', '4 Дж']
        },
        correctIndexes: [0],
        explanation: {
          ru: 'Eк = (m * v²) / 2 = (2 * 16) / 2 = 16 Дж.',
          kk: 'Eк = (m * v²) / 2 = 16 Дж.'
        }
      },
      {
        id: 'bio_01',
        subjectId: 'biology',
        type: 'single',
        points: 1,
        question: {
          ru: 'Какой органоид клетки отвечает за синтез молекул АТФ (энергетическая станция клетки)?',
          kk: 'Жасушаның қай органоиды АТФ синтезіне жауап береді (жасушаның күш станциясы)?'
        },
        options: {
          ru: ['Митохондрия', 'Рибосома', 'Комплекс Гольджи', 'Лизосома'],
          kk: ['Митохондрия', 'Рибосома', 'Гольджи жиынтығы', 'Лизосома']
        },
        correctIndexes: [0],
        explanation: {
          ru: 'Митохондрии обеспечивают клеточное дыхание и синтезируют молекулы АТФ.',
          kk: 'Митохондриялар жасушалық тыныс алуды қамтамасыз етеді және АТФ синтездейді.'
        }
      },
      {
        id: 'chem_01',
        subjectId: 'chemistry',
        type: 'single',
        points: 1,
        question: {
          ru: 'Какое вещество образуется при взаимодействии цинка с соляной кислотой?',
          kk: 'Мырыш тұз қышқылымен әрекеттескенде қандай заттар түзіледі?'
        },
        options: {
          ru: ['Хлорид цинка и водород', 'Оксид цинка и вода', 'Хлорид цинка и хлор', 'Гидроксид цинка'],
          kk: ['Мырыш хлориді және сутек', 'Мырыш оксиді және су', 'Мырыш хлориді және хлор', 'Мырыш гидроксиді']
        },
        correctIndexes: [0],
        explanation: {
          ru: 'Zn + 2HCl → ZnCl₂ + H₂↑. Выделяется газ водород и образуется соль хлорид цинка.',
          kk: 'Zn + 2HCl → ZnCl₂ + H₂↑. Тұз және сутек газы түзіледі.'
        }
      }
    ];

    // Build FULL deterministic questions array (120 questions)
    function generateFullExam(directionId) {
      const dir = DIRECTIONS_CONFIG.find(d => d.id === directionId) || DIRECTIONS_CONFIG[0];
      const p1 = dir.p1;
      const p2 = dir.p2;

      const readingArticles = [
        {
          ru: '«Экосистема Каспийского моря переживает критический период: колебания уровня воды и антропогенная нагрузка ставят под угрозу эндемичные виды, в частности каспийского тюленя. Международные экологические соглашения требуют жесткого контроля над промышленными стоками и создания трансграничных резерватов».',
          kk: '«Каспий теңізінің экожүйесі күрделі кезеңді бастан кешуде: су деңгейінің құбылуы мен антропогендік қысым эндемикалық түрлерге қауіп төндіруде. Халықаралық келісімдер өндірістік қалдықтарды бақылауды талап етеді».'
        }
      ];

      const makeList = (subId, count) => {
        const list = [];
        const base = REAL_ENT_SAMPLES.filter(s => s.subjectId === subId);

        for (let i = 1; i <= count; i++) {
          if (i <= base.length) {
            list.push(base[i - 1]);
            continue;
          }

          const isMultiple = (count === 40 && i >= 36); // Q36–Q40 multiple choice
          const isContext = (subId === 'reading');

          if (isContext) {
            list.push({
              id: `read_${i.toString().padStart(2, '0')}`,
              subjectId: 'reading',
              type: 'context',
              points: 1,
              contextText: readingArticles[0],
              question: {
                ru: `Вопрос №${i} по тексту: Какой вывод следует из приведенного материала?`,
                kk: `Мәтін бойынша №${i} сұрақ: Келтірілген үзіндіден қандай негізгі түйін шығаруға болады?`
              },
              options: {
                ru: [
                  `Проблема требует скоординированных международных экологических мер (Вариант A)`,
                  `Ситуация не требует никакого вмешательства специалистов`,
                  `Эндемичные виды адаптируются самостоятельно без риска`,
                  `Промышленные сбросы не оказывают заметного влияния`
                ],
                kk: [
                  `Мәселе халықаралық үйлестірілген экологиялық шараларды талап етеді (A нұсқасы)`,
                  `Жағдай мамандардың араласуын қажет етпейді`,
                  `Эндемикалық түрлер өздігінен қауіпсіз бейімделеді`,
                  `Өндірістік қалдықтар айтарлықтай әсер етпейді`
                ]
              },
              correctIndexes: [0],
              explanation: {
                ru: 'Прямо следует из содержания статьи об охране Каспия.',
                kk: 'Каспийді қорғау туралы мәтін мазмұнынан тікелей шығады.'
              }
            });
          } else if (isMultiple) {
            list.push({
              id: `${subId}_${i.toString().padStart(2, '0')}`,
              subjectId: subId,
              type: 'multiple',
              points: 2,
              question: {
                ru: `Задание №${i} (Множественный выбор, до 2 баллов): Выберите ВСЕ верные утверждения:`,
                kk: `№${i} тапсырма (Бірнеше дұрыс жауабы бар, 2 баллға дейін): БАРЛЫҚ дұрыс тұжырымдарды көрсетіңіз:`
              },
              options: {
                ru: [
                  `1) Верный академический тезис по теме программы (Вариант A)`,
                  `2) Второе подтвержденное фундаментальное свойство (Вариант B)`,
                  `3) Заведомо ошибочное предположение (Вариант C)`,
                  `4) Третье верное правило из кодификатора (Вариант D)`,
                  `5) Ложный дистрактор, противоречащий закону (Вариант E)`
                ],
                kk: [
                  `1) Бағдарлама тақырыбы бойынша дұрыс академиялық қағида (A нұсқасы)`,
                  `2) Екінші дәлелденген іргелі қасиет (B нұсқасы)`,
                  `3) Бұрмаланған қате тұжырым (C нұсқасы)`,
                  `4) Кодификатордағы үшінші дұрыс ереже (D нұсқасы)`,
                  `5) Заңдылыққа қайшы келетін қате жауап (E нұсқасы)`
                ]
              },
              correctIndexes: [0, 1, 3], // 3 correct choices
              explanation: {
                ru: 'Правильными являются варианты 1, 2 и 4. За полное совпадение начисляется 2 балла, за 1 ошибку — 1 балл.',
                kk: '1, 2 және 4 нұсқалары дұрыс. Толық сәйкестікке 2 балл, 1 қатеге 1 балл беріледі.'
              }
            });
          } else {
            list.push({
              id: `${subId}_${i.toString().padStart(2, '0')}`,
              subjectId: subId,
              type: 'single',
              points: 1,
              question: {
                ru: `Задание №${i}: Укажите правильный ответ на вопрос по дисциплине:`,
                kk: `№${i} тапсырма: Пән бойынша қойылған сұрақтың дұрыс жауабын көрсетіңіз:`
              },
              options: {
                ru: [
                  `Правильный эталонный ответ (Вариант A)`,
                  `Ошибочный дистрактор B`,
                  `Неверный вариант ответа C`,
                  `Не соответствует условию задания D`
                ],
                kk: [
                  `Дұрыс эталон жауап (A нұсқасы)`,
                  `Қате B дистракторы`,
                  `Сәйкес келмейтін C нұсқасы`,
                  `Тапсырма шартына қайшы D нұсқасы`
                ]
              },
              correctIndexes: [0],
              explanation: {
                ru: 'Вариант A является правильным согласно утвержденной спецификации НЦТ РК.',
                kk: 'ҚР ҰТО бекітілген мемлекеттік бағдарламасына сәйкес A нұсқасы дұрыс.'
              }
            });
          }
        }
        return list;
      };

      return {
        history_kz: makeList('history_kz', 20),
        reading: makeList('reading', 10),
        math_lit: makeList('math_lit', 10),
        [p1]: makeList(p1, 40),
        [p2]: makeList(p2, 40)
      };
    }

    // ==========================================
    // 3. MASTER APPLICATION COMPONENT
    // ==========================================
    function App() {
      const [language, setLanguage] = useState('ru');
      const [directionId, setDirectionId] = useState('fizmat');
      const [viewMode, setViewMode] = useState('exam'); // 'exam' | 'mistakes'

      const examData = useMemo(() => generateFullExam(directionId), [directionId]);
      const dirConfig = DIRECTIONS_CONFIG.find(d => d.id === directionId) || DIRECTIONS_CONFIG[0];
      const activeSubjects = ['history_kz', 'reading', 'math_lit', dirConfig.p1, dirConfig.p2];

      const [activeSubject, setActiveSubject] = useState('history_kz');
      const [currentIndex, setCurrentIndex] = useState(0);
      const [answers, setAnswers] = useState({}); // { [qId]: number[] }
      const [bookmarked, setBookmarked] = useState({});
      const [timeLeft, setTimeLeft] = useState(240 * 60); // 240 minutes = 14400s
      const [isFinished, setIsFinished] = useState(false);

      // Modals
      const [showCalc, setShowCalc] = useState(false);
      const [showRef, setShowRef] = useState(false);
      const [showConfirm, setShowConfirm] = useState(false);
      const [refTab, setRefTab] = useState('mendeleev');
      const [mistakes, setMistakes] = useState([]);
      const [blitzItem, setBlitzItem] = useState(null);

      // Flatten questions map
      const allQuestionsMap = useMemo(() => {
        const map = {};
        Object.values(examData).forEach(arr => arr.forEach(q => { map[q.id] = q; }));
        return map;
      }, [examData]);

      // Timer
      useEffect(() => {
        if (isFinished) return;
        const timer = setInterval(() => {
          setTimeLeft(p => {
            if (p <= 1) {
              clearInterval(timer);
              finishExam();
              return 0;
            }
            return p - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [isFinished]);

      const formatTime = (sec) => {
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = sec % 60;
        const pad = n => String(n).padStart(2, '0');
        return `${pad(h)}:${pad(m)}:${pad(s)}`;
      };

      const currentSubjectQuestions = examData[activeSubject] || [];
      const currentQ = currentSubjectQuestions[currentIndex] || currentSubjectQuestions[0];

      const handleSelectOption = (idx, isMult) => {
        if (isFinished || !currentQ) return;
        setAnswers(prev => {
          const cur = prev[currentQ.id] || [];
          if (isMult) {
            const next = cur.includes(idx) ? cur.filter(i => i !== idx) : [...cur, idx];
            return { ...prev, [currentQ.id]: next };
          } else {
            return { ...prev, [currentQ.id]: [idx] };
          }
        });
      };

      // Score Calculation (out of 140)
      const scoreResults = useMemo(() => {
        let total = 0;
        const subScores = {};

        activeSubjects.forEach(sId => {
          const qList = examData[sId] || [];
          let sScore = 0;
          const sMax = SUBJECTS_METADATA[sId]?.maxPoints || 0;

          qList.forEach(q => {
            const uAns = answers[q.id] || [];
            if (q.type === 'multiple') {
              const cSet = new Set(q.correctIndexes);
              const uSet = new Set(uAns);
              let err = 0;
              uAns.forEach(a => { if (!cSet.has(a)) err++; });
              q.correctIndexes.forEach(a => { if (!uSet.has(a)) err++; });

              if (err === 0 && uAns.length > 0) sScore += 2;
              else if (err === 1) sScore += 1;
            } else {
              if (uAns.length === 1 && uAns[0] === q.correctIndexes[0]) sScore += 1;
            }
          });

          subScores[sId] = { score: sScore, max: sMax };
          total += sScore;
        });

        return { total, max: 140, subScores };
      }, [answers, examData, activeSubjects]);

      const finishExam = () => {
        setShowConfirm(false);
        setIsFinished(true);

        const newM = [];
        Object.values(examData).forEach(arr => {
          arr.forEach(q => {
            const u = answers[q.id] || [];
            let ok = false;
            if (q.type === 'multiple') {
              ok = (u.length === q.correctIndexes.length && q.correctIndexes.every(i => u.includes(i)));
            } else {
              ok = (u.length === 1 && u[0] === q.correctIndexes[0]);
            }
            if (!ok) {
              newM.push({
                mistakeId: `m_${Date.now()}_${q.id}`,
                questionId: q.id,
                subjectId: q.subjectId,
                studentAnswers: u,
                status: 'needs_review'
              });
            }
          });
        });

        setMistakes(newM);
        setViewMode('mistakes');
      };

      const letters = ['A', 'B', 'C', 'D', 'E'];

      return (
        <div className="min-h-screen flex flex-col font-sans">
          
          {/* HEADER */}
          <header className="bg-[#0f2444] text-white sticky top-0 z-40 shadow-xl border-b border-blue-900">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 sm:h-20 flex items-center justify-between gap-4">
              
              <div className="flex items-center gap-3">

                      <div className="p-3 bg-slate-50 border rounded-xl font-bold">12<br/><span className="text-xl text-blue-700">Mg</span><br/>Магний</div>
                      <div className="p-3 bg-slate-50 border rounded-xl font-bold">26<br/><span className="text-xl text-blue-700">Fe</span><br/>Железо</div>
                      <div className="p-3 bg-slate-50 border rounded-xl font-bold">29<br/><span className="text-xl text-blue-700">Cu</span><br/>Медь</div>
                      <div className="p-3 bg-slate-50 border rounded-xl font-bold">30<br/><span className="text-xl text-blue-700">Zn</span><br/>Цинк</div>
                      <div className="p-3 bg-slate-50 border rounded-xl font-bold">47<br/><span className="text-xl text-blue-700">Ag</span><br/>Серебро</div>
                    </div>
                  )}
                  {refTab === 'solubility' && (
                    <div className="overflow-x-auto">
                      <table className="w-full text-xs text-center border-collapse">
                        <thead>
                          <tr className="bg-slate-200">
                            <th className="p-2 border">Ион</th>
                            <th className="p-2 border">H⁺</th>
                            <th className="p-2 border">Na⁺</th>
                            <th className="p-2 border">K⁺</th>
                            <th className="p-2 border">Ba²⁺</th>
                            <th className="p-2 border">Ag⁺</th>
                          </tr>
                        </thead>
                        <tbody>
                          <tr>
                            <td className="p-2 border font-bold">OH⁻</td>
                            <td className="p-2 border text-emerald-700 font-bold">Р</td>
                            <td className="p-2 border text-emerald-700 font-bold">Р</td>
                            <td className="p-2 border text-emerald-700 font-bold">Р</td>
                            <td className="p-2 border text-emerald-700 font-bold">Р</td>
                            <td className="p-2 border text-slate-400">-</td>
                          </tr>
                          <tr>
                            <td className="p-2 border font-bold">Cl⁻</td>
                            <td className="p-2 border text-emerald-700 font-bold">Р</td>
                            <td className="p-2 border text-emerald-700 font-bold">Р</td>
                            <td className="p-2 border text-emerald-700 font-bold">Р</td>
                            <td className="p-2 border text-emerald-700 font-bold">Р</td>
                            <td className="p-2 border text-rose-700 font-bold">Н</td>
                          </tr>
                          <tr>
                            <td className="p-2 border font-bold">SO₄²⁻</td>
                            <td className="p-2 border text-emerald-700 font-bold">Р</td>
                            <td className="p-2 border text-emerald-700 font-bold">Р</td>
                            <td className="p-2 border text-emerald-700 font-bold">Р</td>
                            <td className="p-2 border text-rose-700 font-bold">Н</td>
                            <td className="p-2 border text-amber-700 font-bold">М</td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  )}
                  {refTab === 'formulas' && (
                    <div className="space-y-4">
                      <div className="bg-slate-50 p-4 rounded-xl border">
                        <div className="font-bold text-blue-900 mb-1">Физика:</div>
                        <div className="font-mono text-xs">v = v₀ + at | S = v₀t + at²/2 | F = ma | Eк = mv²/2 | Ep = mgh | I = U/R</div>
                      </div>
                      <div className="bg-slate-50 p-4 rounded-xl border">
                        <div className="font-bold text-indigo-900 mb-1">Математика:</div>
                        <div className="font-mono text-xs">sin²α + cos²α = 1 | (xⁿ)' = n·xⁿ⁻¹ | (sin x)' = cos x | Sкруг = πR²</div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* CONFIRM FINISH MODAL */}
          {showConfirm && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm">
              <div className="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl border text-center">
                <h3 className="text-xl font-bold mb-2">Завершить экзамен?</h3>
                <p className="text-xs text-slate-500 mb-6">Все 120 вопросов будут проверены по 140-балльной шкале, и откроется аналитика ошибок.</p>
                <div className="flex gap-3">
                  <button onClick={() => setShowConfirm(false)} className="flex-1 py-2.5 rounded-xl border text-xs font-semibold">Вернуться</button>
                  <button onClick={finishExam} className="flex-1 py-2.5 rounded-xl bg-rose-600 text-white font-bold text-xs shadow">Да, завершить</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
